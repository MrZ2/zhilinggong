<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考勤记录 - 智灵工</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: rgba(0,0,0,.88); font-size: 14px; }

    /* Sidebar */
    .sidebar { position: fixed; top: 0; left: 0; width: 220px; height: 100vh; background: #001529; z-index: 100; display: flex; flex-direction: column; overflow-y: auto; box-shadow: 2px 0 8px rgba(0,0,0,.15); }
    .sidebar-logo { padding: 20px 24px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .sidebar-logo .logo-icon { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #1677ff, #4096ff); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0; }
    .sidebar-logo .logo-text { color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
    .sidebar-menu { padding: 12px 0; flex: 1; }
    .menu-group { padding: 0; }
    .menu-group-title { padding: 10px 24px; font-size: 13px; color: rgba(255,255,255,.65); font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: color .2s; user-select: none; }
    .menu-group-title:hover { color: #fff; }
    .menu-group-title .arrow { width: 12px; height: 12px; transition: transform .25s; opacity: .5; }
    .menu-group-title.collapsed .arrow { transform: rotate(-90deg); }
    .menu-group-items { overflow: hidden; transition: max-height .3s ease; max-height: 200px; }
    .menu-group-items.collapsed { max-height: 0; }
    .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 24px 10px 36px; color: rgba(255,255,255,.65); font-size: 14px; cursor: pointer; transition: all .2s; border-left: 3px solid transparent; text-decoration: none; }
    .menu-item:hover { color: #fff; background: rgba(255,255,255,.04); }
    .menu-item.active { color: #fff; background: #1677ff; border-left-color: #fff; }
    .menu-item .menu-icon { width: 16px; height: 16px; opacity: .7; flex-shrink: 0; }
    .menu-item.active .menu-icon { opacity: 1; }

    /* Main content */
    .main-content { margin-left: 220px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .page-header { background: #fff; padding: 14px 24px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; }
    .page-header h2 { font-size: 18px; font-weight: 600; }

    /* Tabs */
    .tab-bar { background: #fff; border-bottom: 1px solid #f0f0f0; padding: 0 24px; display: flex; gap: 0; flex-shrink: 0; }
    .tab-item { padding: 12px 20px; font-size: 14px; color: rgba(0,0,0,.65); cursor: pointer; border-bottom: 2px solid transparent; transition: color .2s, border-color .2s; font-weight: 500; user-select: none; position: relative; }
    .tab-item:hover { color: #1677ff; }
    .tab-item.active { color: #1677ff; border-bottom-color: #1677ff; }
    .sub-tab-bar { background: #fff; border-bottom: 1px solid #f0f0f0; padding: 0 24px; display: flex; gap: 0; flex-shrink: 0; margin: 12px 24px 0; border-radius: 8px 8px 0 0; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .sub-tab-item { padding: 10px 20px; font-size: 13px; color: rgba(0,0,0,.55); cursor: pointer; border-bottom: 2px solid transparent; transition: color .2s, border-color .2s; user-select: none; font-weight: 500; }
    .sub-tab-item:hover { color: #1677ff; }
    .sub-tab-item.active { color: #1677ff; border-bottom-color: #1677ff; font-weight: 600; }
    /* Daily section wrapper */
    #dailySection { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    #dailySection .filter-bar { margin-bottom: 0; }
    #dailySection .table-wrapper { margin-top: 0; border-radius: 0 0 8px 8px; }
    .tab-content { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    .tab-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: rgba(0,0,0,.25); }
    .tab-placeholder svg { width: 64px; height: 64px; opacity: .4; }
    .tab-placeholder p { font-size: 14px; }
    .tab-placeholder .ph-title { font-size: 16px; font-weight: 500; color: rgba(0,0,0,.35); }

    /* Filter bar - grid 4 cols */
    .filter-bar { background: #fff; padding: 14px 24px; margin: 12px 24px 0; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04); display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 20px; align-items: center; flex-shrink: 0; }
    .filter-item { display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .filter-item label { font-size: 13px; color: rgba(0,0,0,.65); white-space: nowrap; flex-shrink: 0; }
    .filter-item select, .filter-item input[type="text"] { flex: 1; min-width: 0; height: 32px; border: 1px solid #d9d9d9; border-radius: 6px; padding: 0 10px; font-size: 13px; outline: none; background: #fff; }
    .filter-item select:focus, .filter-item input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,.1); }
    .btn-group { display: flex; gap: 8px; justify-content: flex-end; }
    .btn { height: 32px; padding: 0 20px; border-radius: 6px; border: 1px solid #d9d9d9; background: #fff; cursor: pointer; font-size: 13px; transition: all .2s; }
    .btn:hover { border-color: #1677ff; color: #1677ff; }
    .btn-primary { background: #1677ff; border-color: #1677ff; color: #fff; }
    .btn-primary:hover { background: #4096ff; border-color: #4096ff; color: #fff; }

    /* Date picker */
    .date-picker-wrap { position: relative; flex: 1; min-width: 0; }
    .date-picker-trigger { width: 100%; height: 32px; border: 1px solid #d9d9d9; border-radius: 6px; padding: 0 10px; font-size: 13px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: space-between; color: rgba(0,0,0,.88); transition: border-color .2s; }
    .date-picker-trigger:hover { border-color: #1677ff; }
    .date-picker-trigger .dp-icon { color: rgba(0,0,0,.3); font-size: 14px; }
    .date-picker-panel { position: absolute; top: 36px; left: 0; z-index: 50; background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12); padding: 16px; display: none; min-width: 280px; }
    .date-picker-panel.open { display: block; }
    .date-picker-panel .dp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .date-picker-panel .dp-row label { font-size: 12px; color: rgba(0,0,0,.55); width: 50px; flex-shrink: 0; }
    .date-picker-panel .dp-row input[type="date"] { flex: 1; height: 30px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 0 8px; font-size: 13px; outline: none; }
    .date-picker-panel .dp-row input[type="date"]:focus { border-color: #1677ff; }
    .date-picker-panel .dp-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #f0f0f0; }
    .date-picker-panel .dp-actions .btn { height: 28px; padding: 0 14px; font-size: 12px; }

    /* Table - constrained height */
    .table-wrapper { margin: 12px 24px 16px; background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04); overflow: hidden; flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .table-scroll { overflow: auto; flex: 1; min-height: 0; }
    table { border-collapse: collapse; min-width: max-content; }

    :root { --col-name: 100px; --col-phone: 120px; --col-date: 240px; }

    thead th { background: #fafafa; padding: 0; text-align: center; font-weight: 500; font-size: 13px; color: rgba(0,0,0,.75); border: 1px solid #f0f0f0; white-space: nowrap; vertical-align: middle; }
    thead tr:first-child th { padding: 10px 12px; font-size: 13px; color: rgba(0,0,0,.55); letter-spacing: .5px; }
    thead tr:nth-child(2) th { padding: 6px 4px; line-height: 1.3; }
    thead tr:nth-child(2) .day-num { font-size: 14px; font-weight: 600; color: rgba(0,0,0,.88); display: block; }
    thead tr:nth-child(2) .day-week { font-size: 11px; color: rgba(0,0,0,.4); display: block; margin-top: 1px; }
    thead tr:first-child th { position: sticky; top: 0; z-index: 20; background: #fafafa; }
    thead tr:nth-child(2) th { position: sticky; top: 38px; z-index: 20; background: #fafafa; }
    thead tr:first-child th.sticky-l0 { position: sticky; left: 0; z-index: 30; background: #fafafa; }
    thead tr:nth-child(2) th.sticky-l0 { position: sticky; left: 0; z-index: 30; background: #fafafa; }
    thead tr:nth-child(2) th.sticky-l1 { position: sticky; left: var(--col-name); z-index: 30; background: #fafafa; }

    tbody td { padding: 0; border: 1px solid #f0f0f0; vertical-align: top; font-size: 13px; }
    tbody tr:hover td { background: #f8fbff; }
    tbody td.sticky-l0 { position: sticky; left: 0; z-index: 5; background: #fff; }
    tbody td.sticky-l1 { position: sticky; left: var(--col-name); z-index: 5; background: #fff; }
    tbody tr:hover td.sticky-l0, tbody tr:hover td.sticky-l1 { background: #f8fbff; }

    .cell-text { padding: 10px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .emp-name { padding: 10px 12px; font-weight: 500; }

    .date-cell { min-width: var(--col-date); min-height: 48px; cursor: pointer; transition: background .15s; }
    .date-cell:hover { background: #e6f4ff !important; }
    .date-cell.empty { cursor: default; }
    .date-cell.empty:hover { background: transparent !important; }

    .source-group { border-bottom: 1px solid #f0f0f0; }
    .source-group:last-child { border-bottom: none; }
    .source-header { font-size: 11px; font-weight: 700; padding: 3px 8px; border-bottom: 1px solid #f5f5f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .source-header.src-internal { color: #1677ff; background: #f0f7ff; }
    .source-header.src-wecom { color: #389e0d; background: #f6ffed; }
    .source-header.src-hikvision { color: #d46b08; background: #fff7e6; }

    .shift-line { display: flex; align-items: flex-start; gap: 3px; padding: 3px 8px; border-bottom: 1px solid #f8f8f8; font-size: 12px; flex-wrap: wrap; }
    .shift-line:last-child { border-bottom: none; }
    .shift-tag { font-size: 10px; padding: 1px 4px; border-radius: 3px; background: #f0f0f0; color: rgba(0,0,0,.5); font-weight: 500; flex-shrink: 0; margin-top: 1px; }
    .punch-item { display: inline-flex; align-items: center; gap: 2px; }
    .punch-time { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .punch-type-mini { font-size: 10px; padding: 0 3px; border-radius: 2px; }
    .pt-in { background: #e6f4ff; color: #1677ff; }
    .pt-out { background: #fff0f6; color: #c41d7f; }
    .cat-tag { font-size: 10px; padding: 0 3px; border-radius: 2px; font-weight: 600; }
    .cat-makeup { background: #fff7e6; color: #d46b08; }
    .cat-approval { background: #f9f0ff; color: #722ed1; }
    .punch-thumb { width: 22px; height: 22px; border-radius: 3px; object-fit: cover; cursor: pointer; border: 1px solid #e8e8e8; flex-shrink: 0; transition: border-color .15s; }
    .punch-thumb:hover { border-color: #1677ff; }
    .no-record { padding: 14px 12px; color: rgba(0,0,0,.2); text-align: center; font-size: 13px; }

    .weekend { background: #fffbe6; }
    thead .weekend { background: #fff8e1; }

    /* Drawer */
    .drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity .25s; }
    .drawer-mask.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: -540px; width: 540px; height: 100%; background: #fff; z-index: 1001; transition: right .3s cubic-bezier(.4,0,.2,1); box-shadow: -4px 0 24px rgba(0,0,0,.1); display: flex; flex-direction: column; }
    .drawer.open { right: 0; }
    .drawer-header { padding: 16px 24px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .drawer-header h3 { font-size: 16px; font-weight: 600; }
    .drawer-close { width: 32px; height: 32px; border: none; background: none; font-size: 20px; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: rgba(0,0,0,.45); }
    .drawer-close:hover { background: #f5f5f5; color: rgba(0,0,0,.88); }
    .drawer-body { padding: 20px 24px; flex: 1; overflow-y: auto; }
    .detail-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 16px; background: #f8faff; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e8f0fe; }
    .info-item { display: flex; flex-direction: column; gap: 3px; }
    .info-label { font-size: 11px; color: rgba(0,0,0,.4); letter-spacing: .5px; }
    .info-value { font-size: 14px; font-weight: 500; }
    .section-title { font-size: 13px; font-weight: 600; color: rgba(0,0,0,.65); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 6px; }
    .section-title .count { background: #f0f0f0; border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 400; color: rgba(0,0,0,.45); }
    .source-section { margin-bottom: 20px; }
    .source-section-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; padding: 6px 12px; border-radius: 6px; }
    .source-section-title.src-internal { background: #e6f4ff; color: #1677ff; }
    .source-section-title.src-wecom { background: #f6ffed; color: #389e0d; }
    .source-section-title.src-hikvision { background: #fff7e6; color: #d46b08; }
    .shift-sub { margin-bottom: 10px; padding-left: 8px; border-left: 3px solid #e8e8e8; }
    .shift-sub-title { font-size: 12px; font-weight: 600; color: rgba(0,0,0,.55); margin-bottom: 6px; }
    .punch-detail-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid #f0f0f0; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
    .punch-detail-item:hover { border-color: #d6e4ff; background: #f8faff; }
    .pd-time { font-weight: 600; font-size: 14px; min-width: 44px; font-variant-numeric: tabular-nums; }
    .pd-type { font-size: 11px; padding: 2px 7px; border-radius: 4px; }
    .pd-type-in { background: #e6f4ff; color: #1677ff; }
    .pd-type-out { background: #fff0f6; color: #c41d7f; }
    .pd-cat { font-size: 11px; padding: 2px 7px; border-radius: 4px; }
    .pd-cat-normal { background: #f5f5f5; color: rgba(0,0,0,.45); }
    .pd-cat-makeup { background: #fff7e6; color: #d46b08; }
    .pd-cat-approval { background: #f9f0ff; color: #722ed1; }
    .pd-device { color: rgba(0,0,0,.4); font-size: 12px; margin-left: auto; }
    .pd-thumb { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; cursor: pointer; border: 1px solid #e8e8e8; }

    .image-viewer { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 2000; display: none; align-items: center; justify-content: center; cursor: pointer; }
    .image-viewer.open { display: flex; }
    .image-viewer img { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
    .image-viewer .iv-close { position: absolute; top: 16px; right: 24px; color: #fff; font-size: 28px; cursor: pointer; }

    .empty-state { text-align: center; padding: 60px 0; color: rgba(0,0,0,.2); }
    .table-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
    .table-scroll::-webkit-scrollbar-track { background: #f5f5f5; }
    .table-scroll::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 4px; }
    .table-scroll::-webkit-scrollbar-thumb:hover { background: #bbb; }

    /* Daily Overview Table */
    :root { --do-col-date: 120px; --do-col-name: 80px; --do-col-phone: 110px; --do-col-source: 72px; }
    #dailyOverviewFilter { grid-template-columns: repeat(5, 1fr); }
    #dailyOverviewTable { border-collapse: separate; border-spacing: 0; min-width: max-content; }
    #dailyOverviewTable thead th { background: #fafafa; padding: 8px 6px; text-align: center; font-weight: 500; font-size: 12px; color: rgba(0,0,0,.75); border-right: 1px solid #f0f0f0; border-bottom: 1px solid #f0f0f0; white-space: nowrap; vertical-align: middle; letter-spacing: .3px; }
    #dailyOverviewTable thead tr:first-child th { font-size: 13px; color: rgba(0,0,0,.65); letter-spacing: .5px; position: sticky; top: 0; z-index: 20; background: #fafafa; border-top: 1px solid #f0f0f0; }
    #dailyOverviewTable thead tr:nth-child(2) th { padding: 7px 6px; line-height: 1.35; position: sticky; top: 36px; z-index: 20; background: #fafafa; font-size: 12px; }
    #dailyOverviewTable thead th:first-child, #dailyOverviewTable tbody td:first-child { border-left: 1px solid #f0f0f0; }
    #dailyOverviewTable thead th.do-sticky-date   { position: sticky; left: 0; z-index: 30 !important; background: #fafafa; padding: 0; }
    #dailyOverviewTable thead th.do-sticky-name   { position: sticky; left: var(--do-col-date); z-index: 30 !important; background: #fafafa; padding: 0; }
    #dailyOverviewTable thead th.do-sticky-phone  { position: sticky; left: calc(var(--do-col-date) + var(--do-col-name)); z-index: 30 !important; background: #fafafa; padding: 0; }
    #dailyOverviewTable thead th.do-sticky-source { position: sticky; left: calc(var(--do-col-date) + var(--do-col-name) + var(--do-col-phone)); z-index: 30 !important; background: #fafafa; box-shadow: 4px 0 8px rgba(0,0,0,.06); padding: 0; }
    #dailyOverviewTable tbody td { padding: 10px 8px; border-right: 1px solid #f0f0f0; border-bottom: 1px solid #f0f0f0; vertical-align: middle; font-size: 12px; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; transition: background .15s; }
    #dailyOverviewTable tbody tr:hover td { background: #f0f7ff; }
    #dailyOverviewTable tbody tr:nth-child(even) td { background: #fafcff; }
    #dailyOverviewTable tbody tr:nth-child(even):hover td { background: #f0f7ff; }
    #dailyOverviewTable tbody td.do-sticky-date   { position: sticky; left: 0; z-index: 5; background: #fff; text-align: center; padding: 0; }
    #dailyOverviewTable tbody td.do-sticky-name   { position: sticky; left: var(--do-col-date); z-index: 5; background: #fff; padding: 0; }
    #dailyOverviewTable tbody td.do-sticky-phone  { position: sticky; left: calc(var(--do-col-date) + var(--do-col-name)); z-index: 5; background: #fff; color: rgba(0,0,0,.55); padding: 0; }
    #dailyOverviewTable tbody td.do-sticky-source { position: sticky; left: calc(var(--do-col-date) + var(--do-col-name) + var(--do-col-phone)); z-index: 5; background: #fff; box-shadow: 4px 0 8px rgba(0,0,0,.06); padding: 0; }
    #dailyOverviewTable tbody tr:nth-child(even) td.do-sticky-date,
    #dailyOverviewTable tbody tr:nth-child(even) td.do-sticky-name,
    #dailyOverviewTable tbody tr:nth-child(even) td.do-sticky-phone,
    #dailyOverviewTable tbody tr:nth-child(even) td.do-sticky-source { background: #fafcff; }
    #dailyOverviewTable tbody tr:hover td.do-sticky-date,
    #dailyOverviewTable tbody tr:hover td.do-sticky-name,
    #dailyOverviewTable tbody tr:hover td.do-sticky-phone,
    #dailyOverviewTable tbody tr:hover td.do-sticky-source { background: #f0f7ff; }
    /* Group start separator */
    #dailyOverviewTable tbody tr.do-group-start td { border-top: 2px solid #e8e8e8; }
    /* Inner div padding for sticky cells */
    .do-sticky-inner { padding: 10px 8px; display: block; text-align: center; }
    .do-sticky-inner-name { padding: 10px 8px 10px 12px; display: block; text-align: left; font-weight: 500; }
    .do-sticky-inner-th { padding: 8px 6px; display: block; text-align: center; }
    .do-date-str { font-size: 13px; font-weight: 600; color: rgba(0,0,0,.88); display: block; }
    .do-date-week { font-size: 11px; color: rgba(0,0,0,.4); display: block; margin-top: 2px; }
    .do-val-empty { color: rgba(0,0,0,.15); }
    .do-group-attend    { background: #fafafa !important; color: rgba(0,0,0,.65) !important; font-weight: 600; }
    .do-group-abnormal  { background: #fafafa !important; color: rgba(0,0,0,.65) !important; font-weight: 600; }
    .do-group-outing    { background: #fafafa !important; color: rgba(0,0,0,.65) !important; font-weight: 600; }
    .do-group-overtime  { background: #fafafa !important; color: rgba(0,0,0,.65) !important; font-weight: 600; }
    .do-group-leave     { background: #fafafa !important; color: rgba(0,0,0,.65) !important; font-weight: 600; }
    /* Result & status tags */
    .do-result-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; line-height: 1.4; }
    .do-result-normal   { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
    .do-result-abnormal { background: #fff2f0; color: #cf1322; border: 1px solid #ffccc7; }
    .do-result-rest     { background: #f5f5f5; color: rgba(0,0,0,.45); border: 1px solid #e8e8e8; }
    .do-ot-yes { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; background: #f9f0ff; color: #531dab; border: 1px solid #d3adf7; line-height: 1.4; }
    .do-ot-no  { color: rgba(0,0,0,.25); }
    .do-abnormal-val { color: #fa541c; font-weight: 600; }
    /* Source tags in table cells */
    .do-source-tags, .dd-source-tags { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; }

function toggleMenu(el) {

}

// ===== Tab switching =====
let _currentTab = 'timeline';
let _currentSubTab = 0;

const SUB_TAB_LABELS = {
  daily:   ['日报概况统计', '日报打卡明细'],
  monthly: ['月报概况统计', '月报打卡明细'],
};

function showDailyContent(subIdx) {
  const overviewFilter = document.getElementById('dailyOverviewFilter');
  const detailFilter   = document.getElementById('dailyDetailFilter');
  const overviewWrap   = document.getElementById('dailyOverviewTableWrap');
  const detailWrap     = document.getElementById('dailyDetailTableWrap');
  overviewFilter.style.display = 'none';
  detailFilter.style.display   = 'none';
  overviewWrap.style.display   = 'none';
  detailWrap.style.display     = 'none';
  if (subIdx === 0) {
    overviewFilter.style.display = '';
    overviewWrap.style.display   = '';
    applyDailyOverviewFilter();
  } else if (subIdx === 1) {
    detailFilter.style.display = '';
    detailWrap.style.display   = '';
    applyDailyDetailFilter();
  }
}

function switchTab(tab) {
  _currentTab = tab;
  _currentSubTab = 0;
  // Update tab active states
  document.querySelectorAll('#mainTabBar .tab-item').forEach((el, i) => {
    const tabs = ['timeline','daily','monthly'];
    el.classList.toggle('active', tabs[i] === tab);
  });
  // Show/hide content
  const timeline    = document.getElementById('tabTimeline');
  const dailySec    = document.getElementById('dailySection');
  const placeholder = document.getElementById('tabPlaceholder');
  if (tab === 'timeline') {
    timeline.style.display = 'flex';
    dailySec.style.display = 'none';
    placeholder.style.display = 'none';
  } else if (tab === 'daily') {
    timeline.style.display = 'none';
    dailySec.style.display = 'flex';
    placeholder.style.display = 'none';
    const labels = SUB_TAB_LABELS['daily'];
    document.getElementById('subTab0').textContent = labels[0];
    document.getElementById('subTab1').textContent = labels[1];
    updateSubTabActive();
    showDailyContent(0);
  } else {
    // monthly: show placeholder
    timeline.style.display = 'none';
    dailySec.style.display = 'none';
    placeholder.style.display = 'flex';
    updatePlaceholderTitle();
  }
}

function switchSubTab(idx) {
  _currentSubTab = idx;
  updateSubTabActive();
  if (_currentTab === 'daily') {
    showDailyContent(idx);
  } else {
    // monthly
    updatePlaceholderTitle();
  }
}

function updateSubTabActive() {
  document.getElementById('subTab0').classList.toggle('active', _currentSubTab === 0);
  document.getElementById('subTab1').classList.toggle('active', _currentSubTab === 1);
}

  const labels = SUB_TAB_LABELS[_currentTab] || ['概况统计','打卡明细'];

function getDevice(source, idx) { const arr = punchDeviceMap[source] || ['未知设备']; return arr[idx % arr.length]; }

function getDateList(startStr, endStr) {
  const dates = [];
  let d = new Date(startStr + 'T00:00:00');
  const end = new Date(endStr + 'T00:00:00');
  while (d <= end) {
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    dates.push({ str: `${y}-${m}-${day}`, num: d.getDate(), week: WEEKDAYS[d.getDay()], isWeekend: d.getDay()===0||d.getDay()===6 });
    d.setDate(d.getDate()+1);
  }
  return dates;
}

// Render only effective (last in + last out) per shift for the list cell
function renderEffectivePunch(p) {
  const catCfg = CATEGORY_CFG[p.category || 'normal'];

  const typeLabel = p.type === 'in' ? '上' : '下';
  let html = `<span class="punch-item"><span class="punch-type-mini ${typeCls}">${typeLabel}</span><span class="punch-time">${p.time}</span>`;
  if (catCfg.short) html += `<span class="cat-tag ${catCfg.cls}">${catCfg.short}</span>`;
  if (p.photo) html += `<img class="punch-thumb" src="${p.photo}" alt="打卡照片" onclick="event.stopPropagation();openImageViewer('${p.photo}')">`;
  html += `</span>`;
  return html;

function renderBody(dateList, emps) {
  const tbody = document.getElementById('tableBody');
  if (emps.length === 0) { tbody.innerHTML = `<tr><td colspan="${2+dateList.length}"><div class="empty-state">暂无数据</div></td></tr>`; return; }
  tbody.innerHTML = emps.map(emp => {
    const empData = attendanceData[emp.id] || {};
    const cells = dateList.map(d => {
      let sources = empData[d.str] || [];
      if (_filterSource) sources = sources.filter(s => s.source === _filterSource);
      const weekendCls = d.isWeekend ? 'weekend' : '';
      if (sources.length === 0) {
        return `<td class="date-cell empty ${weekendCls}" style="min-width:var(--col-date);"><div class="no-record">--</div></td>`;
      }
      const srcHTML = sources.map(src => {
        const cfg = SOURCE_CFG[src.source];
        const headerText = src.rule ? `${cfg.label}-${src.rule}` : cfg.label;
        const shiftLines = src.shifts.map(sh => {
          // Only show effective: last in + last out
          const inPunches = sh.punches.filter(p => p.type === 'in');
          const outPunches = sh.punches.filter(p => p.type === 'out');
          const lastIn = inPunches.length > 0 ? inPunches[inPunches.length - 1] : null;
          const lastOut = outPunches.length > 0 ? outPunches[outPunches.length - 1] : null;
          let html = `<span class="shift-tag">${sh.name}</span>`;
          if (lastIn) html += renderEffectivePunch(lastIn);
          if (lastOut) html += renderEffectivePunch(lastOut);
          return `<div class="shift-line">${html}</div>`;
        }).join('');
        return `<div class="source-group"><div class="source-header ${cfg.cls}">${headerText}</div>${shiftLines}</div>`;
      }).join('');
      return `<td class="date-cell ${weekendCls}" style="min-width:var(--col-date);" onclick="openDrawer('${emp.id}','${d.str}')">${srcHTML}</td>`;
    }).join('');
    return `<tr>

      <td class="sticky-l1"><div class="cell-text" style="color:rgba(0,0,0,.55);font-size:12px;">${emp.phone}</div></td>
      ${cells}
    </tr>`;
  }).join('');
}

// Compute stats from a single source object
function computeSingleSourceStats(src) {
  let allPunches = [];
  src.shifts.forEach(sh => sh.punches.forEach(p => allPunches.push(p)));
  const inPunches  = allPunches.filter(p => p.type === 'in');
  const outPunches = allPunches.filter(p => p.type === 'out');
  const earliest = inPunches.length  > 0 ? inPunches.map(p=>p.time).sort()[0]    : '--';
  const latest   = outPunches.length > 0 ? outPunches.map(p=>p.time).sort().pop() : '--';
  const punchCount = allPunches.length;
  let stdHours = 8, actHours = 0;
  if (earliest !== '--' && latest !== '--') {
    const [h1,m1] = earliest.split(':').map(Number);
    const [h2,m2] = latest.split(':').map(Number);
    actHours = Math.round(((h2*60+m2)-(h1*60+m1))/6)/10;
  }
  const lateCount  = (earliest !== '--' && earliest > '09:00') ? 1 : 0;
  const lateMin    = lateCount  ? 15 : 0;
  const earlyLeave = (latest   !== '--' && latest   < '17:30') ? 1 : 0;
  const earlyMin   = earlyLeave ? 20 : 0;
  const absentCount = 0, absentMin = 0;
  const missingCard = (inPunches.length === 0 || outPunches.length === 0) ? 1 : 0;
  const locAbnormal = 0, devAbnormal = 0;
  const abnormalTotal = lateCount + earlyLeave + absentCount + missingCard + locAbnormal + devAbnormal;
  const outingCount = 0, outingEarliest = '--', outingLatest = '--';
  const otStatus = actHours > stdHours ? '是' : '否';
  const otHours  = actHours > stdHours ? Math.round((actHours - stdHours)*10)/10 : 0;
  const makeupCount   = allPunches.filter(p => p.category === 'makeup').length;
  const approvalCount = allPunches.filter(p => p.category === 'approval').length;
  const fieldCount = 0;
  let result = '正常';
  if (abnormalTotal > 0) result = '异常';
  if (src.rule === '休息') result = '休息';
  const rule  = src.rule || '--';
  const shift = src.shifts.map(s=>s.name).join(',');
  const leaveApp = approvalCount > 0 ? '有' : '无';
  return {
    rule, shift, earliest, latest, punchCount, stdHours, actHours, leaveApp, result,
    abnormalTotal, lateCount, lateMin, earlyLeave, earlyMin, absentCount, absentMin, missingCard, locAbnormal, devAbnormal,
    outingCount, outingEarliest, outingLatest,
    otStatus, otHours, otWdRest: 0, otWdPay: 0, otReRest: 0, otRePay: 0, otHoRest: 0, otHoPay: 0,
    makeupCount, approvalCount, fieldCount, outing: 0, businessTrip: 0, personalLeave: 0, annualLeave: 0, marriageLeave: 0, maternityLeave: 0
  };
}

          <td>${stats.rule}</td><td>${stats.shift}</td><td>${ve(stats.earliest)}</td><td>${ve(stats.latest)}</td><td>${stats.punchCount}</td><td>${stats.stdHours}</td><td>${stats.actHours}</td><td>${stats.leaveApp}</td><td>${renderResultTag(stats.result)}</td>

          <td>${v(stats.makeupCount)}</td><td>${v(stats.approvalCount)}</td><td>${v(stats.fieldCount)}</td><td>${v(stats.outing)}</td><td>${v(stats.businessTrip)}</td><td>${v(stats.personalLeave)}</td><td>${v(stats.annualLeave)}</td><td>${v(stats.marriageLeave)}</td><td>${v(stats.maternityLeave)}</td>
        </tr>`;
        rows.push(row);

  if (rows.length === 0) {

// Determine punch status label and CSS class
function getPunchStatus(p, isLastIn, isLastOut) {
  if (!p) return { label: '--', cls: 'dd-status-absent' };
  if (p.category === 'makeup')   return { label: '补卡', cls: 'dd-status-late' };
  if (p.category === 'approval') return { label: '审批', cls: 'dd-status-approval' };
  if (isLastIn  && p.time > '09:00') return { label: '迟到', cls: 'dd-status-late' };
  if (isLastOut && p.time < '17:30') return { label: '早退', cls: 'dd-status-early' };
  return { label: '正常', cls: 'dd-status-normal' };
}

// Build slot cells for one source's shifts
function buildSlotCells(src) {
  const shiftSlots = src.shifts.map(sh => {
    const inP  = sh.punches.filter(p => p.type === 'in');
    const outP = sh.punches.filter(p => p.type === 'out');
    const lastIn  = inP.length  > 0 ? inP[inP.length  - 1] : null;
    const lastOut = outP.length > 0 ? outP[outP.length - 1] : null;
    return { lastIn, lastOut };
  });
  while (shiftSlots.length < 4) shiftSlots.push({ lastIn: null, lastOut: null });
  const cells = [];
  for (let si = 0; si < 4; si++) {
    const slot = shiftSlots[si];
    if (slot.lastIn) {
      const st = getPunchStatus(slot.lastIn, true, false);
      cells.push(`<td>${slot.lastIn.time}</td><td><span class="dd-status-tag ${st.cls}">${st.label}</span></td>`);
    } else {
      cells.push(`<td><span class="do-val-empty">--</span></td><td><span class="dd-status-tag dd-status-absent">缺卡</span></td>`);
    }
    if (slot.lastOut) {
      const st = getPunchStatus(slot.lastOut, false, true);
      cells.push(`<td>${slot.lastOut.time}</td><td><span class="dd-status-tag ${st.cls}">${st.label}</span></td>`);
    } else {
      cells.push(`<td><span class="do-val-empty">--</span></td><td><span class="dd-status-tag dd-status-absent">缺卡</span></td>`);
    }
  }
  return cells.join('');
}

// Build record text for one source
function buildRecordText(src) {
  const punches = [];
  src.shifts.forEach(sh => sh.punches.forEach(p => punches.push(p)));
  return punches.map(p => {
    const tag    = p.type === 'in' ? '上' : '下';
    const catTag = p.category === 'makeup' ? '[补]' : p.category === 'approval' ? '[审]' : '';
    return `${tag}${p.time}${catTag}`;
  }).join(' / ');
}

function renderDailyDetailBody(dateList, emps, sourceFilter) {
  const tbody = document.getElementById('dailyDetailBody');
  const rows = [];
  emps.forEach(emp => {
    dateList.forEach(d => {
      const allSources = (attendanceData[emp.id] || {})[d.str] || [];
      if (allSources.length === 0) return;
      const displaySources = sourceFilter
        ? allSources.filter(s => s.source === sourceFilter)
        : allSources;
      if (displaySources.length === 0) return;
      // Rowspan merge: date/name/phone merged for same group; first row carries rowspan
      const rowCount = displaySources.length;
      displaySources.forEach((src, si) => {
        const cfg = SOURCE_CFG[src.source];
        const srcTag = `<span class="dd-src-tag ${cfg.cls}">${cfg.label}</span>`;
        const slotCells  = buildSlotCells(src);
        const recordText = buildRecordText(src);
        const rowCls = (si > 0) ? ' class="dd-group-cont"' : ' class="dd-group-start"';
        let row = `<tr${rowCls}>`;
        if (si === 0) {
          row += `
          <td class="dd-sticky-date" rowspan="${rowCount}"><div class="dd-sticky-inner"><span class="do-date-str">${d.str}</span><span class="do-date-week">${d.week}</span></div></td>
          <td class="dd-sticky-name" rowspan="${rowCount}"><div class="dd-sticky-inner-name">${emp.name}</div></td>
          <td class="dd-sticky-phone" rowspan="${rowCount}"><div class="dd-sticky-inner">${emp.phone}</div></td>`;
        }
        row += `
          <td class="dd-sticky-source"><div class="dd-sticky-inner"><div class="dd-source-tags">${srcTag}</div></div></td>
          ${slotCells}
          <td class="dd-record-cell">${recordText}</td>
        </tr>`;
        rows.push(row);
      });
    });
  });
  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="21"><div class="empty-state">暂无数据</div></td></tr>`;
  } else {
    tbody.innerHTML = rows.join('');
  }
}
